<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GITRL — the robot's entrance</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<!--
  Harness for the robot's ENTRANCE (robot.js, robot-splat.js). Served by serve.py:
  http://127.0.0.1:8124/dev-robot.html

    ?who=splat      the scanned robot (rigid) instead of the primitives robot (jointed)
    ?view=orbit     look at it up close (default: the landing's exact stage camera)
    ?t=1.4          freeze the entrance at 1.4 s (pomme's ?claw=N): framing and captures
    ?twos=12        pomme's stepped look (default: every frame)     ?reduced   prefers-reduced-motion
    ?style=0        the plain vertex-coloured meshes the painterly pass starts from
    ?hull=0         no outline      ?strokes=1.2  finer strokes (default 0.6)   ?line=1.4  heavier line
    ?bg=paper       light ground, to judge the line      ?yaw=1.2   (orbit) turn the robot

  window.devRobot = { rig | body, act, renderer, info() } for tools/dev/robot.mjs.
-->
<style>
  html,body{margin:0;height:100%;background:#121116;overflow:hidden;
    font:12px/1.6 ui-monospace,"JetBrains Mono",monospace;color:#8e8b86}
  #gl{width:100%;height:100%;display:block}
  #hud{position:fixed;top:14px;right:16px;z-index:5;width:270px;
    background:rgba(12,12,14,.72);border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(18px);border-radius:9px;padding:12px 15px}
  #hud b{color:#efece6;font-weight:600} #hud .n{color:#cfcac1}
  #hud hr{border:0;border-top:1px solid rgba(255,255,255,.09);margin:9px 0}
  #hud .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  button{font:inherit;color:#efece6;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    border-radius:6px;padding:3px 9px;cursor:pointer}
  button[aria-pressed=true]{background:#efece6;color:#050506}
  input[type=range]{width:100%}
  body.shot #hud{display:none}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js",
               "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="row"><b id="who">Bracket Bot</b><span class="n" id="fps">…</span></div><hr>
  <div class="row"><span>meshes · triangles</span><span class="n" id="tris">…</span></div>
  <div class="row"><span>draw calls</span><span class="n" id="calls">…</span></div>
  <div class="row"><span>t · phase · lean</span><span class="n" id="pose">…</span></div>
  <hr>
  <div class="row"><button id="bRoll">pop up</button><button id="bStage">stage</button><button id="bOrbit">orbit</button>
    <button id="bTwos">twos</button><button id="bHull">line</button></div>
  <hr><input type="range" id="scrub" min="0" max="8" step="0.01" value="0">
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/gaussian-splats-3d/gaussian-splats-3d.module.js';
import { buildBracketBot, paintRobot, robotLights, restPose, makePopUp, poseRig, poseRigid, POP } from './robot.js';

const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
if (Q.has('shot')) document.body.classList.add('shot');
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.has('shot') ? 1 : Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(Q.get('bg') === 'paper' ? '#ece9e1' : '#121116');
scene.add(robotLights());

const stageCam = new THREE.PerspectiveCamera(40, 2, 0.1, 100);             // scene.js, value for value
stageCam.position.set(0, 2.3, 8.4); stageCam.lookAt(0, 2.1, 0);
const orbitCam = new THREE.PerspectiveCamera(32, 2, 0.05, 100);
const controls = new OrbitControls(orbitCam, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

const who = Q.get('who') === 'splat' ? 'splat' : 'primitives', HEIGHT = +(Q.get('height') || 2.7);
$('who').textContent = `Bracket Bot — ${who}`;
let rig = null, body = null, look = null;
if (who === 'splat') {
  const { buildSplatBody } = await import('./robot-splat.js');
  body = await buildSplatBody({ height: HEIGHT, pixelRatio: renderer.getPixelRatio() });
  scene.add(body.root);
} else {
  rig = buildBracketBot({ height: HEIGHT });
  look = Q.get('style') !== '0' ? paintRobot(rig, { strokes: +(Q.get('strokes') || 0.6), line: +(Q.get('line') || 1) }) : null;
  if (look && Q.get('hull') === '0') look.setHull(false);
  scene.add(rig.root);
}
const actor = rig ? { root: rig.root, scale: rig.scale, pose: (st, c) => poseRig(rig, st, c) }
  : { root: body.root, scale: body.scale, pose: (st, c) => poseRigid(body, st, c) };

const cfg = { ...POP, twos: +(Q.get('twos') || 0), reduced: Q.has('reduced') };
const ui = { view: Q.get('view') === 'orbit' ? 'orbit' : 'stage', freeze: Q.has('t') ? +Q.get('t') : null, start: 0.6, hull: true };
let now = 0, last = null, act = null;
function layout() {                 // the frame's bottom edge at the robot's depth: what stageEntrance measures on the landing
  stageCam.updateMatrixWorld(); const e = new THREE.Vector3(0, -1, 0.5).unproject(stageCam).sub(stageCam.position);
  e.multiplyScalar((cfg.z - stageCam.position.z) / e.z).add(stageCam.position);
  act = makePopUp(actor.scale, { ...cfg, edgeY: e.y });
}
function setView(v) {
  ui.view = v; $('bStage').setAttribute('aria-pressed', v === 'stage'); $('bOrbit').setAttribute('aria-pressed', v === 'orbit');
  if (v === 'orbit') {
    actor.root.position.set(0, 0, 0); actor.root.rotation.set(0, +(Q.get('yaw') || 0.5), 0);
    if (rig) { restPose(rig); rig.wheelL.rotation.x = rig.wheelR.rotation.x = 0.6; } else body.pivot.rotation.set(0, 0, 0);
    const d = +(Q.get('dist') || 5.2), h = +(Q.get('lookY') || 1.2);
    orbitCam.position.set(Math.sin(0.35) * d, h + 0.35, Math.cos(0.35) * d); controls.target.set(0, h, 0);
  }
}
$('bRoll').onclick = () => { ui.freeze = null; ui.start = now; setView('stage'); };
$('bStage').onclick = () => setView('stage'); $('bOrbit').onclick = () => setView('orbit');
$('bTwos').onclick = () => { cfg.twos = cfg.twos ? 0 : 12; layout(); $('bTwos').setAttribute('aria-pressed', !!cfg.twos); };
$('bHull').onclick = () => { ui.hull = !ui.hull; look && look.setHull(ui.hull); $('bHull').setAttribute('aria-pressed', ui.hull); };
$('scrub').oninput = (e) => { ui.freeze = +e.target.value; setView('stage'); };
$('bTwos').setAttribute('aria-pressed', !!cfg.twos); $('bHull').setAttribute('aria-pressed', true);
setView(ui.view);

let tris = 0, meshes = 0;
if (rig) rig.root.traverse((o) => { if (o.isMesh && !o.userData.isOutline) { meshes++; tris += o.geometry.attributes.position.count / 3; } });
$('tris').textContent = rig ? `${meshes} · ${Math.round(tris).toLocaleString()}` : `1 splat · ${body.state.count.toLocaleString()} gaussians`;

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  for (const c of [stageCam, orbitCam]) { c.aspect = w / h; c.updateProjectionMatrix(); }
  layout();
}
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
let frames = 0, acc = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1); now += dt;
  if (ui.view === 'stage') {
    const t = ui.freeze ?? (now - ui.start);
    last = actor.pose(act.state(t), act.cfg);
    if (ui.freeze == null) $('scrub').value = Math.min(8, Math.max(0, t));
    $('pose').textContent = `${t.toFixed(2)} · ${last.phase} · ${(last.lean * 57.3).toFixed(1)}°`;
  } else controls.update();
  renderer.render(scene, ui.view === 'stage' ? stageCam : orbitCam);
  frames++; acc += dt;
  if (acc >= 0.5) { $('fps').textContent = `${Math.round(frames / acc)} fps`; $('calls').textContent = renderer.info.render.calls; frames = 0; acc = 0; }
});
window.devRobot = { who, rig, body, actor, renderer, scene, stageCam, orbitCam, cfg, ui, meshes, tris: Math.round(tris), get act() { return act; },
  info: () => ({ calls: renderer.info.render.calls, programs: renderer.info.programs.length }) };
</script>
</body>
</html>
