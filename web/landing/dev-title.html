<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dev · GITRL title</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<!--
  Harness for title.js alone: the real camera and lights (buildSpyRig), the real
  MangaPass, a stand-in back wall so contrast matches the factory.
    ?raw            skip the manga pass
    ?arm            show the pomme spy-cam arm too (hidden by default)
    ?bg=none        flat dark background instead of the stand-in wall
    ?poke=2&at=6    poke letter 2 at t = 6 s (&every=3 repeats, &dir=up for a hop)
    ?t=5            start the clock at 5 s (skip the intro wait)
    ?sim=8          run a fixed-step 60 Hz simulation to t = 8 s, record window.__trace,
                    render that frame and stop (deterministic stills + motion sampling)
-->
<script type="module">
import * as THREE from 'three';
import { buildSpyRig } from './snakeArms.js';
import { MangaPass } from './styles.js';
import { createWorld } from './layout.js';
import { buildTitle } from './title.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const rig = buildSpyRig();
const { scene, camera } = rig;
rig.cam.root.visible = Q.has('arm');
rig.claw.root.visible = Q.has('arm');
const manga = new MangaPass(renderer, { bw: 1, grit: 1 });

if (Q.get('bg') === 'none') {
  scene.background = new THREE.Color('#08080b');
} else {
  // stand-in factory: a lit, dark back wall and floor (the real hall is hall.js)
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 30),
    new THREE.MeshStandardMaterial({ color: '#6c6a74', roughness: 0.92 }));
  wall.position.set(0, 4, -10);
  scene.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30),
    new THREE.MeshStandardMaterial({ color: '#2c2b31', roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, -1.2, -5);
  scene.add(floor);
  scene.background = new THREE.Color('#050506');
}

const world = createWorld(scene, camera);
const title = await buildTitle(world);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  manga.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  camera.aspect = w / h;
  camera.position.z = 8.4 + Math.max(0, 1.6 - w / h) * 4.2;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// clicks -> world.click, exactly as scene.js fills it
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const plane0 = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
addEventListener('pointerdown', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const letter = world.title.pick(ray);
  const hit = letter >= 0 ? ray.intersectObject(world.title.letters[letter].mesh, false)[0] : null;
  if (hit) world.click.point.copy(hit.point);
  else ray.ray.intersectPlane(plane0, world.click.point);
  world.click.letter = letter;
  world.click.t = world.t;
});
addEventListener('pointermove', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.ray.intersectPlane(plane0, world.cursor.point);
  world.cursor.seen = true;
  world.cursor.movedAt = world.t;
}, { passive: true });

// scheduled pokes
const pokeI = Q.has('poke') ? Number(Q.get('poke')) : -1;
const pokeAt = Number(Q.get('at') ?? 6), pokeEvery = Number(Q.get('every') ?? 0);
const pokeDir = Q.get('dir') === 'up' ? new THREE.Vector3(0, 1, -0.3) : null;
let nextPoke = pokeAt;
function schedule(t) {
  if (pokeI >= 0 && t >= nextPoke) {
    title.letters[pokeI] && world.title.poke(pokeI, 1, pokeDir);
    nextPoke = pokeEvery > 0 ? nextPoke + pokeEvery : Infinity;
  }
}

function step(t, dt) {
  world.t = t; world.dt = dt;
  schedule(t);
  title.update(world);
  if (Q.has('arm')) rig.update(t, { cam: Math.min(1, t / 2.6) });
}
function draw() {
  if (Q.has('raw')) { renderer.setRenderTarget(null); renderer.render(scene, camera); }
  else manga.render(scene, camera);
}

if (Q.has('sim')) {
  // deterministic: fixed 60 Hz steps; trace every frame for motion analysis
  const T = Number(Q.get('sim'));
  const trace = [];
  const p = new THREE.Vector3();
  for (let f = 0; f <= Math.round(T * 60); f++) {
    const t = f / 60;
    step(t, 1 / 60);
    trace.push([t, ...title.letters.flatMap((L) => {
      world.title.center(L.i, p);
      return [L.y, L.hang.rotation.x, L.hang.rotation.z, L.hang.rotation.y, L.body.scale.y - 1, p.x, p.y, p.z];
    })]);
  }
  window.__trace = trace;
  // the manga pass's paper / halftone / crosshatch textures load asynchronously, and
  // sim mode draws exactly one frame: draw too early and `paper` is still black, which
  // renders the whole scene as ink. Wait for the loaders to go idle first.
  await new Promise((done) => {
    let settled = false;
    const finish = () => { if (!settled) { settled = true; done(); } };
    THREE.DefaultLoadingManager.onLoad = finish;
    setTimeout(finish, 2500);
  });
  draw();
  const seamPt = world.title.seam(0, 0.25, new THREE.Vector3());
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);          // measure the SCENE, not the pass's quad
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  draw();
  window.__report = { calls, tris,
                      seam0: seamPt.toArray().map((v) => +v.toFixed(3)),
                      normal0: world.title.normal(0).toArray().map((v) => +v.toFixed(3)),
                      center2: world.title.center(2).toArray().map((v) => +v.toFixed(3)) };
  window.__done = true;
} else {
  const t0 = performance.now() / 1000 - Number(Q.get('t') ?? 0);
  let last = t0;
  renderer.setAnimationLoop(() => {
    const now = performance.now() / 1000;
    const dt = Math.min(now - last, 1 / 30);
    last = now;
    step(now - t0, dt);
    draw();
  });
}
window.dev = { world, title, rig, renderer };
</script>
</body>
</html>
