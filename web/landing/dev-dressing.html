<!doctype html>
<html><head><meta charset="utf-8"><title>dressing</title>
<style>html,body{margin:0;height:100%;background:#060608;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head><body><canvas id="gl"></canvas>
<script type="module">
// dressing.js in the REAL composition: hall + title + watchers around it, through the
// real pass.  ?raw skips the pass · ?only=dressing,hall picks modules · ?guides draws
// the keep-out boxes (title + margin, ENTER) so intrusions are obvious.
import * as THREE from 'three';
import { buildSpyRig } from './snakeArms.js';
import { MangaPass } from './styles.js';
import { createWorld, TITLE } from './layout.js';
import { createSparks } from './mech.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.info.autoReset = false;
const rig = buildSpyRig();
const { scene, camera } = rig;
scene.background = new THREE.Color('#060608');
const manga = new MangaPass(renderer, { bw: 1, grit: 1 });
const world = createWorld(scene, camera);
world.sparks = createSparks(scene);
world.hero = [];

const MODULES = [['./hall.js', 'buildHall'], ['./title.js', 'buildTitle'], ['./watchers.js', 'buildWatchers'],
  ['./dressing.js', 'buildDressing']];
const only = Q.get('only') ? Q.get('only').split(',') : null;
const slots = MODULES.map(() => null);
MODULES.forEach(([path, fn], i) => {
  if (only && !only.some((n) => path.includes(n))) return;
  import(path).then((m) => m[fn](world)).then((mod) => { slots[i] = mod; })
    .catch((e) => console.warn(`[dev] ${path} not running:`, e));
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false); manga.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  const fit = (TITLE.width / 2 + 0.55) / (0.364 * camera.aspect) + TITLE.center.z;
  camera.position.z = Math.max(8.4, fit);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// keep-out guides, drawn on a 2D overlay in ndc
if (Q.has('guides')) {
  const c2 = document.createElement('canvas');
  c2.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none';
  document.body.appendChild(c2);
  const draw = () => { c2.width = innerWidth; c2.height = innerHeight; const g = c2.getContext('2d');
    g.strokeStyle = '#ff3b3b'; g.lineWidth = 2;
    const box = (x0, x1, y0, y1) => g.strokeRect((x0 + 1) / 2 * c2.width, (1 - y1) / 2 * c2.height,
      (x1 - x0) / 2 * c2.width, (y1 - y0) / 2 * c2.height);
    box(-0.62, 0.62, -0.5, 0.6); box(-0.25, 0.25, -0.95, -0.45); };
  addEventListener('resize', draw); draw();
}

const ray = new THREE.Raycaster(), want = new THREE.Vector3(), sweep = new THREE.Vector3();
let clock = 0, last = performance.now() / 1000;
addEventListener('pointerdown', () => { world.click = { t: world.t, point: want.clone(), letter: -1 }; });
renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000, dt = Math.min(1 / 20, Math.max(0, now - last));
  last = now; clock += dt; world.t = clock; world.dt = dt;
  renderer.info.reset();
  if (Q.has('click') && clock > +Q.get('click') && world.click.t < 0) world.click = { t: clock, point: want.clone(), letter: -1 };
  want.set(Math.sin(clock * 0.35) * 3.2, 2.0 + Math.sin(clock * 0.27) * 0.9, 0);
  sweep.copy(want).project(camera); world.cursor.ndc.set(sweep.x, sweep.y);
  ray.setFromCamera(world.cursor.ndc, camera); world.cursor.ray.copy(ray.ray); world.cursor.point.copy(want);
  rig.update(clock, { cam: 0, claw: 0 });            // pomme arms parked: judge the dressing, not them
  for (let i = 0; i < slots.length; i++) {
    if (!slots[i]) continue;
    try { slots[i].update(world); } catch (e) { console.warn('[dev] stopped', MODULES[i][0], e); slots[i] = null; }
  }
  world.sparks.update(dt);
  if (Q.has('raw')) renderer.render(scene, camera); else manga.render(scene, camera);
});
window.gitrl = { world, renderer, slots, camera };
</script></body></html>
