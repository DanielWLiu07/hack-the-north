<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- view transitions: the opt-in is INLINE so it is known before the first frame (through pages.css -> @import it sometimes arrived
     after Chrome had decided: "ViewTransition opt-in disabled"). pages.css still @imports room-transitions.css for the keyframes. -->
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<title>GITIRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  /* the hero is one full-viewport canvas with nothing over it: everything in it is 3D.
     The dashboard (dash.css / dash.js) is ordinary DOM below it, on clean dark ground. */
  html { background: #060608; scroll-behavior: smooth; }
  body { margin: 0; background: #060608; color: #efece6; }
  #hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* the dashboard's section nav is the site's one bar: /pages/sitenav.css (it says where the page's sections are) */
  #dashboard { scroll-margin-top: 56px; }
  #dashboard > section { scroll-margin-top: 80px; }
</style>
<link rel="stylesheet" href="/pages/room-transitions.css">   <!-- cross-document view transitions: must be STATIC and in the head — an incoming transition is decided before scene.js runs -->
<link rel="stylesheet" href="/pages/sitenav.css">
<link rel="stylesheet" href="./dash.css">
<link rel="stylesheet" href="./graph.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<!-- Which page is this — the locked hero (/) or the dashboard (/?info)? Decided HERE, before first paint, not 1.3 s
     later when scene.js has downloaded three.js. A page that paints one layout and then hides half of itself
     (and locks scrolling) makes Chrome DROP the incoming cross-document view transition: measured 0/8 into / and
     /?info before this, 8/8 after — with first paint still at ~0.27 s. (blocking="render" on the module scripts also
     fixes it, 6/8 and 8/8, but holds first paint for the whole three.js download: 0.27 s -> 1.6 s on a phone.)
     scene.js still sets the same styles when it runs; these only make the FIRST frame the right one. -->
<script>document.documentElement.classList.add(new URLSearchParams(location.search).has('info') ? 'view-info' : 'view-hero');</script>
<style>
  .view-hero, .view-hero body { overflow: hidden; height: 100%; }
  .view-hero #dashnav, .view-hero #dashboard { display: none; }
  .view-info #hero { display: none; }
</style>
<noscript><style>#dashnav, #dashboard { display: revert !important; } html, body { overflow: auto !important; height: auto !important; }</style></noscript>
</head>
<body>
<section id="hero" aria-label="GITIRL"><canvas id="gl" aria-label="GITIRL: a factory of camera arms, all looking at you"></canvas></section>
<nav id="dashnav" class="sitenav" aria-label="Dashboard sections">
  <a class="brand" href="/" aria-label="GITIRL — back to the front door">GITIRL</a>
  <a class="sec" href="/?info" aria-current="page">Overview</a>
  <a class="sec" href="/robot">Room</a>
  <a class="sec" href="/telemetry">Telemetry</a>
</nav>
<main id="dashboard">
  <section id="status" aria-label="Room status"></section>
  <section id="search" aria-label="Search the room's history"></section>
  <section id="history" aria-label="The room's commit graph"></section>
</main>
<script type="module" src="./scene.js"></script>
<script type="module" src="./dash.js"></script>
<script type="module" src="./livemap.js"></script>   <!-- the robot on its map, once something publishes nav -->
<script type="module" src="./ledger.js"></script>    <!-- chores and pull requests, under the CI badge -->
<script type="module" src="./roommap.js"></script>
<script type="module" src="./graph.js"></script>
<script type="module" src="./roommate.js"></script>   <!-- the 3D roommate: mounts into #roommate-stage and mirrors the Point beat (landing visuals) -->
<script type="module" src="./sentry.js"></script>
</body>
</html>
