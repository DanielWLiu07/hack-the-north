<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- view transitions: the opt-in is INLINE so it is known before the first frame (through pages.css -> @import it sometimes arrived
     after Chrome had decided: "ViewTransition opt-in disabled"). pages.css still @imports room-transitions.css for the keyframes. -->
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<script>for (const ev of ['pageswap', 'pagereveal']) addEventListener(ev, (e) => { const t = e.viewTransition; if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p.catch(() => {}); });</script>
<!-- Seer's entrance owns the first frame, so this is INLINE for the same reason the opt-in above is: it has to
     be true before the first paint. seer.js is a three.js scene behind a dynamic import, and it only gets to
     hide the page (body.seer-intro, pages/seer/intro-stage.js) once that whole module graph has landed — about
     400 ms in, measured. Without this the page paints the nav, the heading and the robot panel, and then snatches
     them away to play the entrance, which reads as the old page loading and then breaking. A cover holds the
     first ~400 ms instead, and it lifts the moment the entrance takes over.
     It can never strand the page: it is never raised where Seer cannot run (reduced motion, no WebGL), and a
     watchdog lifts it if seer.js never arrives at all. -->
<style>
  html.seer-booting, html.seer-booting body { overflow:hidden; }
  /* above .sitenav's z-index:40, so the cover really is the whole page.
     two layers on purpose: the backdrop must stay fully opaque, so only the dot is allowed to pulse.
     Animating one combined layer fades the page back into view on every beat. */
  html.seer-booting body::after { content:''; position:fixed; inset:0; z-index:60; background:#060608; }
  html.seer-booting body::before {
    content:''; position:fixed; inset:0; z-index:61; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, #ef42c6 0 5px, rgba(239,66,198,.18) 6px 13px, rgba(239,66,198,0) 14px);
    animation:seerboot 1.25s ease-in-out infinite;
  }
  @keyframes seerboot { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  @media (prefers-reduced-motion:reduce) { html.seer-booting body::before { animation:none } }
</style>
<script>
(function () {
  var root = document.documentElement;
  // Reduced motion finishes the entrance immediately, so there is nothing to wait for and nothing to cover.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try { var c = document.createElement('canvas');
        if (!(c.getContext('webgl2') || c.getContext('webgl'))) return; }   // no Seer here: show the board
  catch (e) { return; }
  root.classList.add('seer-booting');
  var done = false, bail;
  var lift = function () { if (done) return; done = true; clearTimeout(bail); obs.disconnect(); root.classList.remove('seer-booting'); };
  // Two ways out, so the cover tracks what actually happened rather than a guessed duration:
  //   success - intro-stage.js sets body.seer-intro, which hides the same page, so the swap has no gap;
  //   failure - telemetry.js marks the band data-seer="missing" when the import or the mount throws.
  // A fixed timeout alone was wrong both ways: too short and a slow first load (three.js is 1.3 MB) reveals
  // the board only for the entrance to snatch it back again, too long and a dead Seer holds the page hostage.
  var obs = new MutationObserver(function () {
    if (document.body && document.body.classList.contains('seer-intro')) return lift();
    var band = document.getElementById('stage');
    if (band && band.dataset.seer === 'missing') lift();
  });
  obs.observe(root, { attributes:true, subtree:true, attributeFilter:['class','data-seer'] });
  // How long the page is allowed to be BLANK, which is a different question from how long to wait for a
  // signal. On this laptop the intro signals at ~100 ms, so the seamless swap is untouched. On a slow link
  // the intro can be five seconds out, and five seconds of black reads as a dead page — worse than the
  // flicker this cover exists to prevent. Past this we show the board: content late beats nothing.
  bail = setTimeout(lift, 1800);
})();
</script>
<title>telemetry · GITIRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/pages/pages.css">
<link rel="stylesheet" href="/pages/sitenav.css">
<link rel="stylesheet" href="/pages/telemetry-robot.css">
<!-- the three states of a Sentry issue (open · resolved · removed) and Seer's beam: pages/sentry-board.js -->
<link rel="stylesheet" href="/pages/sentry-board.css">
<link rel="stylesheet" href="/pages/capture-3d.css">
<!-- Seer (pages/seer/seer.js) is a three.js scene; three is vendored with the landing page -->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/three.module.js",
  "three/addons/": "/vendor/three/addons/"
} }
</script>
<!-- Seer's module graph is ~1.4 MB and it is behind a dynamic import at the END of telemetry.js, so without
     these the download does not even START until the page has finished loading. Warming it here overlaps the
     fetch with the rest of the page and brings the entrance forward by roughly the time it used to wait. -->
<link rel="modulepreload" href="/pages/seer/seer.js">
<link rel="modulepreload" href="/vendor/three/three.module.js">
<link rel="modulepreload" href="/vendor/three/addons/utils/BufferGeometryUtils.js">
<link rel="modulepreload" href="/pages/seer/scan-overlay.js">
<link rel="modulepreload" href="/pages/seer/intro-stage.js">
<link rel="modulepreload" href="/pages/seer/intro-bugs.js">
<link rel="modulepreload" href="/pages/seer/intro-effects.js">
<link rel="modulepreload" href="/pages/seer/lettering.js">
<link rel="modulepreload" href="/pages/seer/decor.js">
<link rel="modulepreload" href="/pages/seer/glass-theme.js">
<link rel="modulepreload" href="/pages/seer/panel-effects.js">
</head>
<body class="telemetry">
<a class="skip" href="#board">Skip to the captures</a>

<nav class="sitenav" aria-label="GITIRL">
  <a class="brand" href="/" aria-label="GITIRL — home">GITIRL</a>
  <a class="sec" href="/robot">Room</a>
  <a class="sec" href="/telemetry" aria-current="page">Telemetry</a>
</nav>

<!-- Seer's band: top of the page, its own height, in the normal flow (it does not follow the scroll) -->
<header class="seerband" id="stage">
  <canvas id="seer" aria-hidden="true"></canvas>
  <div class="bandtext">
    <h1>telemetry</h1>
  </div>
  <div class="bandnav"></div>
</header>

<!-- Robot · live (pages/telemetry-robot.js, link session). OUTSIDE <main> on purpose: <main> stays hidden until the
     board's Elasticsearch query answers; whether the robot is reachable and what it sees must not wait for that. -->
<section class="robotlive" aria-labelledby="h-robot">
  <h2 class="rulehead" id="h-robot">Robot · live <span class="right" id="robot-live-state">connecting…</span></h2>
  <div id="robot-live"></div>
</section>

<main id="main" class="tboard" hidden>
  <div class="tags" id="tags"></div>

  <section aria-labelledby="h-sum">
    <h2 class="rulehead" id="h-sum">Capture overview</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section aria-labelledby="h-stack">
    <h2 class="rulehead" id="h-stack">Sentry observability</h2>
    <div class="stack" id="stack"></div>
  </section>

  <section aria-labelledby="h-sentry-live">
    <h2 class="rulehead" id="h-sentry-live">Sentry · live <span class="right" id="sentry-live-state">checking…</span></h2>
    <div id="sentry-toast" class="sentry-toast" hidden role="status" aria-live="assertive"></div>
    <div id="sentry-live" class="failures sentry-live" aria-label="Live Sentry issues"></div>
  </section>

  <section aria-labelledby="h-live">
    <h2 class="rulehead" id="h-live">Recent failures <span class="right" id="live-state">connecting…</span></h2>
    <div id="live" hidden></div><!-- the 3-signal strip lived here; "Robot · live" above now draws EVERY signal -->
    <div id="failures" class="failures" aria-label="Recent failures"></div>
    <details id="seer-config" class="seercfg"><summary>Seer settings</summary><div id="seer-config-body"></div></details>
  </section>

  <section id="board" aria-labelledby="h-board">
    <h2 class="rulehead" id="h-board">Capture history <span class="right">Newest first · motion ±2 s around each shutter</span></h2>
    <p class="key" id="board-key"></p>
    <div class="ledger" id="cards"></div>
  </section>
</main>

<p class="state-msg" id="state" role="status">Loading the board…</p>

<script type="module" src="/pages/telemetry-robot.js"></script>
<script type="module" src="/pages/telemetry.js"></script>
</body>
</html>
