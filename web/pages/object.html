<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- view transitions: the opt-in is INLINE so it is known before the first frame (through pages.css -> @import it sometimes arrived
     after Chrome had decided: "ViewTransition opt-in disabled"). pages.css still @imports room-transitions.css for the keyframes. -->
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<script>for (const ev of ['pageswap', 'pagereveal']) addEventListener(ev, (e) => { const t = e.viewTransition; if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p.catch(() => {}); });</script>
<title>object — GITRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/pages/pages.css">
<link rel="stylesheet" href="/pages/sitenav.css">
</head>
<body>
<a class="skip" href="#main">Skip to the evidence</a>

<nav class="sitenav" aria-label="GITRL">
  <a class="brand" href="/">GITRL</a>
  <a class="sec" href="/?info#status">Status</a>
  <a class="sec" href="/?info#search">Search</a>
  <a class="sec" href="/?info#history">History</a>
  <a class="sec" href="/telemetry">Telemetry</a>
  <a class="sec" href="/robot">Room</a>
</nav>

<header class="top">
  <a class="crumb" href="/?info#search">GITRL · object</a>
  <h1 id="obj-id">…</h1>
  <div class="meta" id="meta"></div>
  <nav class="nav" aria-label="Elsewhere">
    <a href="/?info#history">commit graph</a>
    <a href="/?info#search">search</a>
  </nav>
  <div class="tags" id="tags"></div>
  <div class="verdict" id="presence" role="status" hidden></div>
</header>

<main id="main" class="grid" hidden>
  <div class="col">
    <section class="card" id="verdict-card" aria-labelledby="h-verdict" hidden>
      <h2 id="h-verdict">Where did it go?</h2>
      <div id="verdict-body"></div>
    </section>

    <section class="card" id="said" aria-labelledby="h-said">
      <h2 id="h-said">Every description, per camera, per capture</h2>
      <p class="lede" id="said-lede"></p>
      <div id="said-body"></div>
    </section>
  </div>

  <div class="col">
    <section class="card" id="point" aria-labelledby="h-point">
      <h2 id="h-point">Drive there and point</h2>
      <div id="point-body"></div>
    </section>

    <section class="card" id="where" aria-labelledby="h-where">
      <h2 id="h-where">Where it has stood</h2>
      <div id="track-body"></div>
      <h3 id="h-seen">Sightings — camera confidence over time</h3>
      <div id="seen-body"></div>
    </section>

    <section class="card" id="life" aria-labelledby="h-life">
      <h2 id="h-life">Its life, commit by commit</h2>
      <div class="tablewrap"><table id="life-table"></table></div>
    </section>
  </div>
</main>

<p class="state-msg" id="state" role="status">Loading the object…</p>

<script type="module" src="/pages/object.js"></script>
</body>
</html>
