<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- view transitions: the opt-in is INLINE so it is known before the first frame (through pages.css -> @import it sometimes arrived
     after Chrome had decided: "ViewTransition opt-in disabled"). pages.css still @imports room-transitions.css for the keyframes. -->
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<script>for (const ev of ['pageswap', 'pagereveal']) addEventListener(ev, (e) => { const t = e.viewTransition; if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p.catch(() => {}); });</script>
<title>capture — GITIRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/pages/pages.css">
<link rel="stylesheet" href="/pages/sitenav.css">
<link rel="stylesheet" href="/pages/replay.css">
</head>
<body>
<a class="skip" href="#main">Skip to the evidence</a>

<nav class="sitenav" aria-label="GITIRL">
  <a class="brand" href="/" aria-label="GITIRL — home">GITIRL</a>
  <a class="sec" href="/?info#status">Status</a>
  <a class="sec" href="/?info#search">Search</a>
  <a class="sec" href="/?info#history">History</a>
  <a class="sec" href="/telemetry">Telemetry</a>
  <a class="sec" href="/robot">Room</a>
</nav>

<header class="top">
  <a class="crumb" href="/">GITIRL · capture</a>
  <h1 id="cap-id">…</h1>
  <div class="meta" id="meta"></div>
  <nav class="nav" id="nav" aria-label="Neighbouring captures"></nav>
  <div class="tags" id="tags"></div>
  <div class="verdict" id="verdict" role="status" hidden></div>
</header>

<main id="main" class="grid" hidden>
  <div class="col">
    <section class="card" id="cameras" aria-labelledby="h-cams">
      <h2 id="h-cams">Three cameras, one object
        <label class="right">object <select id="pick" aria-label="Object shown in the three camera views"></select></label>
      </h2>
      <p class="lede" id="cams-lede"></p>
      <div class="cams" id="cams"></div>
    </section>

    <section class="card" id="disagreement" aria-labelledby="h-dis">
      <h2 id="h-dis">Per-camera disagreement</h2>
      <p class="lede" id="dis-lede"></p>
      <div class="legend" id="legend" aria-hidden="true"></div>
      <div class="tablewrap"><table id="dis-table"></table></div>
      <details id="rejected"></details>
    </section>
  </div>

  <div class="col">
    <section class="card" id="gate" aria-labelledby="h-gate">
      <h2 id="h-gate">Quality gate</h2>
      <div class="gate" id="gate-cells"></div>
    </section>

    <section class="card" id="telemetry" aria-labelledby="h-tel">
      <h2 id="h-tel">Telemetry, ±2 s around the shutter <a class="right" href="#replay" id="to-replay">▶ replay this moment</a></h2>
      <div id="tel-body"></div>
    </section>

    <section class="card" id="sentry" aria-labelledby="h-sentry">
      <h2 id="h-sentry">The trace</h2>
      <div id="sentry-body"></div>
    </section>

    <section class="card" id="diff" aria-labelledby="h-diff">
      <h2 id="h-diff">What the diff concluded</h2>
      <div id="diff-body"></div>
    </section>
  </div>
</main>

<!-- Robot Session Replay (docs/29): the same capture, scrubbed. Its own module; mounted when scrolled to. -->
<section class="replay-embed" id="replay" aria-label="Robot session replay" hidden><div id="replay-host"></div></section>

<p class="state-msg" id="state" role="status">Loading the capture…</p>

<script type="module" src="/pages/capture.js"></script>
<script type="module">
const id = (/^\/capture\/([a-z]+_[0-9]+)$/.exec(location.pathname) || [])[1], box = document.getElementById('replay');
if (id) {
  box.hidden = false;
  const mount = async () => (await import('/pages/replay.js')).mountReplay(document.getElementById('replay-host'), { captureId: id, embedded: true });
  if (location.hash.startsWith('#replay') || location.hash.startsWith('#t=')) { mount().then(() => box.scrollIntoView()); }
  else new IntersectionObserver((seen, io) => { if (seen.some((e) => e.isIntersecting)) { io.disconnect(); mount(); } }, { rootMargin: '600px' }).observe(box);
}
</script>
</body>
</html>
