<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- view transitions: the opt-in is INLINE so it is known before the first frame (same two lines as telemetry.html) -->
<style>@view-transition{navigation:auto}@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}</style>
<script>for (const ev of ['pageswap', 'pagereveal']) addEventListener(ev, (e) => { const t = e.viewTransition; if (t) for (const p of [t.ready, t.finished, t.updateCallbackDone]) p.catch(() => {}); });</script>
<title>scene · GITIRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/pages/pages.css">
<link rel="stylesheet" href="/pages/sitenav.css">
<link rel="stylesheet" href="/pages/scene.css">
<!-- three is vendored with the landing page. Only the core is: no PLYLoader, no OrbitControls — scene.js reads the
     one PLY layout room_live.py writes and carries its own z-up orbit, so nothing is fetched from anywhere else. -->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/three.module.js"
} }
</script>
</head>
<body class="scenepage">
<a class="skip" href="#captures">Skip to the captures</a>

<nav class="sitenav" aria-label="GITIRL">
  <a class="brand" href="/" aria-label="GITIRL — home">GITIRL</a>
  <a class="sec" href="/?info#status">Status</a>
  <a class="sec" href="/?info#search">Search</a>
  <a class="sec" href="/?info#history">History</a>
  <a class="sec" href="/telemetry">Telemetry</a>
  <a class="sec" href="/robot">Room</a>
  <a class="sec" href="/scene" aria-current="page">Scene</a>
</nav>

<main class="scene">
  <div class="viewport" id="viewport">
    <canvas id="cloud" tabindex="0" aria-label="The room's point cloud. Drag to orbit, right-drag or shift-drag to pan, wheel to zoom."></canvas>
    <div class="bar" id="bar" hidden><i id="bar-fill"></i></div>

    <!-- why there is no picture (or why the newest one did not load), in words -->
    <div class="why" id="why" hidden><div><strong id="why-title"></strong><span id="why-text"></span></div></div>

    <p class="readout mono" id="readout" role="status">starting…</p>
    <p class="hint mono">drag orbit · right-drag / shift pan · wheel zoom · grid 1 m</p>
  </div>

  <aside class="panel left" aria-label="Instance and captures">
    <h1>scene <span class="tag local" title="Served to a loopback peer with no forwarding header. Through the tunnel this page and its clouds are a 403.">this laptop only</span></h1>
    <label class="field"><span>instance</span>
      <select id="instance" aria-label="Instance"></select></label>
    <p class="sub mono" id="instance-meta"></p>
    <label class="check"><input type="checkbox" id="follow" checked> <span>follow latest <small id="follow-state"></small></span></label>
    <h2 class="rulehead">captures <span class="right">newest first</span></h2>
    <ol class="caps" id="captures"></ol>
    <p class="sub" id="captures-note"></p>
  </aside>

  <aside class="panel right" aria-label="View">
    <div class="seg" role="group" aria-label="Colour">
      <button type="button" id="c-camera" aria-pressed="true">colour: camera</button>
      <button type="button" id="c-height" aria-pressed="false">height</button>
    </div>
    <div class="ramp" id="ramp" hidden><i></i><span class="mono">0 m</span><span class="mono">2.5 m</span></div>
    <label class="field"><span>point size <output id="size-out" class="mono"></output></span>
      <input type="range" id="size" min="1" max="30" step="0.5" value="8"></label>
    <label class="field"><span>range crop <output id="crop-out" class="mono"></output></span>
      <input type="range" id="crop" min="0.5" max="6" step="0.1" value="4"></label>
    <div class="seg views" role="group" aria-label="View from">
      <button type="button" data-view="behind">behind</button>
      <button type="button" data-view="top">top</button>
      <button type="button" data-view="eye">robot's eye</button>
    </div>
    <p class="sub mono" id="frame-ms"></p>
  </aside>
</main>

<script type="module" src="/pages/scene.js"></script>
</body>
</html>
