<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>Seer — dev harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html { background: #060608; color: #efece6; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; }
  #band { position: relative; height: 42vh; min-height: 220px; border-bottom: 1px solid rgba(239,236,230,.14); }
  @media (max-width: 700px) { #band { height: 30vh; min-height: 180px; } }
  #seer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: absolute; left: 12px; bottom: 10px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: 12px ui-monospace, monospace; background: #15151b; color: #efece6; border: 1px solid #3a3a44; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 120px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { border: 1px solid rgba(239,236,230,.14); border-radius: 10px; padding: 16px; min-height: 150px; position: relative; }
  .card h3 { margin: 0 0 8px; font: 500 12px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #8e8b86; }
  .chart { height: 80px; border-left: 1px solid #444; border-bottom: 1px solid #444; position: relative; }
  .mark { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #f2a03c; }
  .num { font: 600 40px ui-monospace, monospace; }
  pre { grid-column: 1 / -1; font: 12px ui-monospace, monospace; color: #8e8b86; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="band"><canvas id="seer"></canvas>
  <div id="bar"></div>
</div>
<main>
  <div class="card" data-seer-target><h3>cap_0003 · passed</h3><div class="num" id="t-pass">0.005</div><p>tilt_rate_max, rad/s</p></div>
  <div class="card"><h3>cap_0004 · tilt_rate</h3><div class="chart"><span class="mark" id="t-spike" style="left:46%;top:8px"></span></div></div>
  <div class="card"><h3>cap_0004 · rejected</h3><div class="num" id="t-reject" style="color:#f2a03c">0.083</div><p>the gate needs &lt; 0.05</p></div>
  <pre id="out"></pre>
</main>
<script type="module">
// Fires every state, with or without a target element.  ?state=stumped&target=t-reject  ·  ?tour=1 runs the two real sequences
// (summoned -> thinking -> stumped, and summoned -> thinking -> verdict)
import { mountSeer } from '/pages/seer/seer.js';
const Q = new URLSearchParams(location.search);
if (Q.has('room')) {
  const band = document.getElementById('band'); band.classList.add('seerband');
  band.style.cssText = 'position:fixed;inset:0;height:100dvh;min-height:0';
  document.querySelector('main').classList.add('tboard');
}
const seer = await mountSeer(document.getElementById('seer'));
window.seer = seer;
const targets = { summoned: 't-reject', thinking: 't-reject', verdict: 't-reject', stumped: 't-reject' };
const fire = (s, id) => seer.react(s, id ? document.getElementById(id) : null);
for (const s of ['idle', 'summoned', 'thinking', 'verdict', 'stumped']) {
  const b = document.createElement('button'); b.textContent = s; b.onclick = () => fire(s, targets[s]); document.getElementById('bar').append(b);
}
if (Q.get('state')) fire(Q.get('state'), Q.get('target') || targets[Q.get('state')]);
if (Q.has('tour')) { const seq = ['idle', 'summoned', 'thinking', 'stumped', 'idle', 'summoned', 'thinking', 'verdict']; let i = 0; setInterval(() => { const s = seq[++i % seq.length]; fire(s, targets[s]); }, 3500); }
setInterval(() => { document.getElementById('out').textContent = JSON.stringify(seer._debug()); }, 500);
window.seerReady = true;
</script>
</body>
</html>
