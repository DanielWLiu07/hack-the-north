# The committed "good" state: the demo table plus the shelf beside it.
#
# Ground truth, in the canonical world frame (docs/20 Part 2): metres, X forward from
# the anchor tag, Y left, Z up, floor at z = 0. Desk top at z = 0.70, shelf top at 0.90.
#   pose:    [x, y, z, yaw]  — bbox centre; yaw = the AXIS of extents.x, [0, 180)
#   extents: [x, y, z]       — x = the long side, y = width, z = height
#   Round footprints (aspect < 1.2) have no axis: yaw 0. That's what perception reports.
#   label:   what stock YOLO calls it (COCO has no "mug" — it says "cup")
#   descriptions: the VLM's pool for this object. Every capture draws three DIFFERENT
#            ones, one per camera view — the disagreement is the point.
# Several z values (0.755, 0.745, 0.725) sit exactly on a 1 cm bucket boundary on
# purpose: that is the case hysteresis exists for.

message: "the bench, tidied"

room:
  zones:
    desk:  {min: [0.08, -0.50, 0.68], max: [1.00, 0.50, 1.30], surface: 0.70}
    shelf: {min: [0.10, 0.60, 0.88], max: [0.95, 1.00, 1.40], surface: 0.90}
  anchor: {id: tag_0, family: tag36h11, size_m: 0.10, pose: [0.0, 0.0, 0.70, 0]}
  # Where `room reset`/`checkout` put objects the target tree doesn't have. Outside every zone,
  # so nothing in it is tracked — without it, removing an object is an unapplied hunk.
  bin: {pose: [0.30, -0.75, 0.45]}
  home: [-0.40, 0.0, 0]   # where the robot parks: behind the anchor tag, facing +X
  roomignore: [person, robot, cable, "zones/floor/**"]

# Per-camera systematic error. cam0 sees the anchor tag, so it is the reference;
# cam2's extrinsics are ~4.5 cm off — that's the "cam0 x=0.42, cam2 x=0.47" story.
cameras:
  cam0: {bias: [0.000, 0.000, 0.000], noise: 0.004, quality: 0.00}
  cam1: {bias: [0.008, -0.006, 0.003], noise: 0.006, quality: -0.04}
  cam2: {bias: [0.045, 0.011, -0.004], noise: 0.009, quality: -0.09}

